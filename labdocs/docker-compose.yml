services:
  site:
    build:
      context: .
      target: base
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --bind 0.0.0.0 --port 1313 --baseURL http://localhost:1313/"
    ports:
      - "1313:1313"
    volumes:
      - .:/app
      - labdocs_node_modules:/app/node_modules
      - labdocs_hugo_cache:/tmp/hugo_cache
    environment:
      HUGO_CACHEDIR: /tmp/hugo_cache

volumes:
  labdocs_node_modules:
  labdocs_hugo_cache:
