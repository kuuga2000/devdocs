<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Cheat Sheet | Docs</title>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            darkMode: "class",
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            scroll-behavior: smooth;
        }

        html.dark body {
            background-color: #0d1117;
        }

        html.dark .theme-surface {
            background-color: rgba(13, 17, 23, 0.96);
            border-color: #21262d;
        }

        html.dark .theme-search {
            background-color: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            box-shadow: inset 0 1px 0 rgba(240, 246, 252, 0.03);
        }

        html.dark .theme-search:focus {
            background-color: #161b22;
            border-color: #1f6feb;
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.2);
        }

        html.dark .theme-toggle {
            background-color: #161b22;
            color: #c9d1d9;
            border-color: #30363d;
            box-shadow: inset 0 1px 0 rgba(240, 246, 252, 0.03);
        }

        html.dark .theme-toggle:hover {
            background-color: #21262d;
            color: #ffffff;
        }

        html.dark .theme-link {
            color: #8b949e;
        }

        html.dark .theme-link:hover {
            color: #c9d1d9;
        }

        html.dark .theme-brand {
            color: #f0f6fc;
        }

        html.dark .theme-brand-accent {
            color: #58a6ff;
        }

        html.dark .theme-search-icon {
            color: #8b949e;
        }

        html.dark .theme-border {
            border-color: #30363d;
        }

        html.dark .theme-tip {
            background-color: rgba(56, 139, 253, 0.08);
            border-color: rgba(56, 139, 253, 0.22);
        }

        html.dark .theme-tip-title {
            color: #79c0ff;
        }

        html.dark .theme-tip-text {
            color: #a5d6ff;
        }

        html.dark .theme-title,
        html.dark .section-title {
            color: #f0f6fc;
        }

        html.dark .theme-muted,
        html.dark .section-summary {
            color: #8b949e;
        }

        html.dark .theme-empty {
            background-color: #161b22;
        }

        html.dark .theme-footer {
            background-color: #0d1117;
            border-color: #30363d;
        }

        html.dark .theme-footer-text,
        html.dark .group-title {
            color: #8b949e;
        }

        html.dark .command-card {
            background-color: #161b22;
            border-color: #30363d;
            box-shadow: none;
        }

        html.dark .command-code {
            background-color: #0d1117;
            color: #79c0ff;
        }

        html.dark .command-copy:hover {
            background-color: #21262d;
            color: #79c0ff;
        }

        html.dark .command-description {
            color: #c9d1d9;
        }

        html.dark .section-divider {
            border-color: #30363d;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
        }

        .command-card:hover .copy-btn {
            opacity: 1;
        }

        .nav-link:hover {
            background-color: #f1f5f9;
            color: #2563eb;
        }

        html.dark .nav-link:hover {
            background-color: #161b22;
            color: #79c0ff;
        }

        .nav-link.active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }

        html.dark .nav-link.active {
            background-color: rgba(56, 139, 253, 0.16);
            color: #79c0ff;
        }
    </style>
    <script>
        if (localStorage.getItem("devdocs-theme") === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>

<body class="text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 theme-surface">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg">
                    <i data-lucide="terminal" class="w-5 h-5 text-white"></i>
                </div>
                <span class="theme-brand font-bold tracking-tight text-lg">DEV<span class="theme-brand-accent text-blue-600">DOCS</span></span>
            </div>

            <div class="relative w-full max-w-md ml-8">
                <i data-lucide="search" class="theme-search-icon absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search commands..."
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border-transparent rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none theme-search">
            </div>

            <div class="hidden md:flex items-center gap-4">
                <button id="themeToggle" type="button"
                    class="theme-toggle inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-600 transition-colors hover:text-slate-900">
                    <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
                    <span id="themeLabel">Dark</span>
                </button>
                <a href="https://github.com" class="theme-link text-slate-500 hover:text-slate-900 transition-colors">
                    <i data-lucide="github" class="w-5 h-5"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row gap-8">
        <aside
            class="hidden md:block w-64 pt-12 sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto pb-10 border-r border-slate-100 theme-border">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-3">Categories</p>
            <nav id="sidebarNav" class="space-y-1 pr-4"></nav>

            <div class="mt-8 pr-4">
                <div class="theme-tip p-4 bg-blue-50 rounded-2xl border border-blue-100">
                    <p class="theme-tip-title text-xs font-semibold text-blue-700 mb-1">Pro Tip</p>
                    <p class="theme-tip-text text-[11px] text-blue-600 leading-relaxed">Click category names to jump to sections
                        instantly.</p>
                </div>
            </div>
        </aside>

        <main class="flex-1 py-12">
            <header class="mb-12">
                <h1 class="theme-title text-4xl font-extrabold tracking-tight mb-4 text-slate-900">Command Reference</h1>
                <p class="theme-muted text-slate-500 text-lg">Quick access to essential developer commands and syntax.</p>
            </header>

            <div id="commandGrid" class="grid gap-12"></div>

            <div id="noResults" class="hidden py-20 text-center">
                <div class="theme-empty bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search-x" class="w-8 h-8 text-slate-400"></i>
                </div>
                <h3 class="theme-title text-lg font-semibold text-slate-900">No commands found</h3>
                <p class="theme-muted text-slate-500">Try searching for something else.</p>
            </div>
        </main>
    </div>

    <footer class="theme-footer mt-20 py-12 border-t border-slate-200 text-center bg-white">
        <p class="theme-footer-text text-sm text-slate-400">Built for GitHub Pages • Interactive Cheat Sheet</p>
    </footer>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
</body>

</html>
