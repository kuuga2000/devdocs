<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Cheat Sheet | Docs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            scroll-behavior: smooth;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
        }

        .command-card:hover .copy-btn {
            opacity: 1;
        }

        .nav-link:hover {
            background-color: #f1f5f9;
            color: #2563eb;
        }

        .nav-link.active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>

<body class="text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg">
                    <i data-lucide="terminal" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-bold tracking-tight text-lg">DEV<span class="text-blue-600">DOCS</span></span>
            </div>

            <div class="relative w-full max-w-md ml-8">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search commands..."
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border-transparent rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none">
            </div>

            <div class="hidden md:flex items-center gap-4">
                <a href="https://github.com" class="text-slate-500 hover:text-slate-900 transition-colors">
                    <i data-lucide="github" class="w-5 h-5"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row gap-8">
        <aside
            class="hidden md:block w-64 pt-12 sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto pb-10 border-r border-slate-100">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-3">Categories</p>
            <nav id="sidebarNav" class="space-y-1 pr-4"></nav>

            <div class="mt-8 pr-4">
                <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                    <p class="text-xs font-semibold text-blue-700 mb-1">Pro Tip</p>
                    <p class="text-[11px] text-blue-600 leading-relaxed">Click category names to jump to sections
                        instantly.</p>
                </div>
            </div>
        </aside>

        <main class="flex-1 py-12">
            <header class="mb-12">
                <h1 class="text-4xl font-extrabold tracking-tight mb-4 text-slate-900">Docker Command Reference</h1>
                <p class="text-slate-500 text-lg">Quick access to essential Docker commands and syntax.</p>
            </header>

            <div id="commandGrid" class="grid gap-12"></div>

            <div id="noResults" class="hidden py-20 text-center">
                <div class="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search-x" class="w-8 h-8 text-slate-400"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-900">No commands found</h3>
                <p class="text-slate-500">Try searching for something else.</p>
            </div>
        </main>
    </div>

    <footer class="mt-20 py-12 border-t border-slate-200 text-center bg-white">
        <p class="text-sm text-slate-400">Built for GitHub Pages • Interactive Cheat Sheet</p>
    </footer>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
</body>

</html>
